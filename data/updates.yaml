- date: 2026-04-16
  version: v5.0.3
  title: Patch Notes - v5.0.3
  description: A smaller release focused on stability and performance improvements following the codebase change, with bug fixes, backend enhancements, and key feature additions.
  changes:
    - fixed: An issue with uncrossable not giving users their earnings
    - fixed: An issue with the new customize features not working despite working in initial testing
    - fixed: Default ban messages showing an error instead of mentioning the user on bans/unbans despite still banning/unbanning them
    - improved: Faster API endpoints for things like the commands and status endpoints
    - improved: Faster API endpoints for fetching server information for commands like serverinfo, membercount, etc
    - improved: Faster grabbing of profiles for things like purge and ticket logs
    - new: Purge logs and bulk message deletion logs
    - changed: The commands steal and emoji bulk add/many now require antinuke whitelist
    - new: Command detection for emoji additions/deletions for antinuke
